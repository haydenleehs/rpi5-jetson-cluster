# /etc/slurm/slurm.conf. Must be IDENTICAL on rpi5-login and orin-node01.
# After editing: copy to both nodes, restart slurmctld (Pi) and slurmd (Jetson).

ClusterName=orincluster
SlurmctldHost=rpi5-login(10.0.0.1)

# Auth & users
AuthType=auth/munge
SlurmUser=slurm

# Process tracking (simple, no cgroup setup needed)
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
MpiDefault=none

# Look up the job user's groups on the compute node, not the controller.
# Without this, jobs miss the Jetson-only 'video'/'render' groups and the GPU
# fails with "NvRmMemInitNvmap failed: Permission denied".
LaunchParameters=disable_send_gids

# Scheduling: allocate by core + memory
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
ReturnToService=2

# State & logs
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# GPU
GresTypes=gpu

# Nodes: check values with `slurmd -C` on the Jetson; keep RealMemory below the reported value
NodeName=orin-node01 NodeAddr=10.0.0.11 CPUs=6 RealMemory=6500 Gres=gpu:1 State=UNKNOWN
PartitionName=jetson Nodes=orin-node01 Default=YES MaxTime=INFINITE State=UP
